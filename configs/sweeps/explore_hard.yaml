# Looking for more "MountainCar-like" tasks: environments where a fairly tuned DQN
# (eps_greedy_fast) might fail for lack of exploration. Every method runs on every
# environment (the weekend batch of 2026-10-09). Run with --seeds 0-4.
# 6 environments x 7 = 42 configurations.
#
# river_swim   deceptive small reward near the start (20k steps)
# straight     long corridor, reward at the end (30k)
# four_rooms_stuck / four_rooms_loop   FourRooms variants (200k)
# (taxi was dropped: it has no binned visit counter, which SUN/DISCOVER's
#  goal-reached check needs, so they crash on the first reached goal)
# travel_field / wall_large            large maps, 28x28 and 50x50 (1M)

global_sweep:
  environment:
    - river_swim
    - straight
    - four_rooms_stuck
    - four_rooms_loop
    - travel_field
    - wall_large

config_sweep:
  - algorithm: [eps_greedy, eps_greedy_fast]
  - algorithm: discover
    agent.critic.explore_only: False
  - algorithm: sun_greedy_step
    agent.actor.greedy.value: 0.0
  - algorithm: sun_greedy_sticky
    agent.actor.greedy.value: [0.002, 0.01]
  - algorithm: sun_greedy_sched
    agent.actor.greedy.end_value: 1.0
