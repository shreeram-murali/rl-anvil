# @package _global_
# SUN (sun_ratio_adaptive) that also learns the task Q-function and acts
# greedily on it with a per-step probability that grows linearly over training:
# explore with SUN early, exploit the task more and more later.
defaults:
  - sun_ratio_adaptive
  - _self_

agent:
  critic:
    explore_only: False
  actor:
    greedy_mode: step
    greedy:
      id: LinearDecay
      init_value: 0.0
      end_value: 0.5
      steps: ${experiment.training_steps}
      constant_init_steps: ${experiment.warm_up}
      constant_end_steps: ${experiment.cool_down}
